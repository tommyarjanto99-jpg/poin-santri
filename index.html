<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Poin & Absensi Santri</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans" x-data="app()" x-init="init()">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🕌 Manajemen Poin & Absensi Santri
            </h1>
            <!-- Navigasi Tab -->
            <div class="flex flex-wrap justify-center bg-emerald-700 p-1 rounded-xl text-xs sm:text-sm font-semibold gap-1">
                <button @click="activeTab = 'poin'" :class="activeTab === 'poin' ? 'bg-white text-emerald-800 shadow' : 'text-white hover:bg-emerald-600'" class="px-3 py-1.5 rounded-lg transition">✨ Poin & Hadiah</button>
                <button @click="activeTab = 'absensi'" :class="activeTab === 'absensi' ? 'bg-white text-emerald-800 shadow' : 'text-white hover:bg-emerald-600'" class="px-3 py-1.5 rounded-lg transition">📋 Rekap Absensi</button>
                <button @click="activeTab = 'siswa'" :class="activeTab === 'siswa' ? 'bg-white text-emerald-800 shadow' : 'text-white hover:bg-emerald-600'" class="px-3 py-1.5 rounded-lg transition">👥 Kelola Siswa</button>
                <button @click="activeTab = 'pengaturan'" :class="activeTab === 'pengaturan' ? 'bg-white text-emerald-800 shadow' : 'text-white hover:bg-emerald-600'" class="px-3 py-1.5 rounded-lg transition">⚙️ Kelola Hadiah & Poin</button>
            </div>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

        <!-- Status Loading Database -->
        <div x-show="loading" class="bg-amber-100 border border-amber-300 text-amber-800 px-4 py-2 rounded-xl text-sm text-center font-semibold">
            ⏳ Mengambil data dari database Supabase...
        </div>

        <!-- Selector Kelas Aktif (Muncul di tab poin & absensi) -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4" x-show="activeTab === 'poin' || activeTab === 'absensi'">
            <div class="w-full sm:w-1/3">
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Pilih Kelas</label>
                <select x-model="selectedClass" @change="selectedStudentId = null" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="">-- Pilih Kelas --</option>
                    <template x-for="cls in classes" :key="cls">
                        <option :value="cls" x-text="'Kelas ' + cls"></option>
                    </template>
                </select>
            </div>
            <div class="w-full sm:w-2/3 text-right text-sm text-slate-500">
                Total Siswa di Kelas: <span class="font-bold text-slate-700" x-text="studentsInClass.length">0</span> anak
            </div>
        </div>

        <!-- ================= TAB 1: POIN & HADIAH ================= -->
        <div x-show="activeTab === 'poin'" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Daftar Siswa -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                    <h2 class="font-bold text-slate-700 border-b pb-2">Daftar Siswa</h2>
                    <template x-if="selectedClass
